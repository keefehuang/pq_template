[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pushquantum"
version = "0.1.0"
description = "Minimal template for neutral-atom circuit compilation with a custom AOD `move` instruction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qiskit>=1.3",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pushquantum"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
isort.required-imports = ["from __future__ import annotations"]
